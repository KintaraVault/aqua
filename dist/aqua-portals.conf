# xdg-desktop-portal routing for XDG_CURRENT_DESKTOP=Aqua
# (install to /usr/share/xdg-desktop-portal/aqua-portals.conf)
[preferred]
default=aqua;gtk;
org.freedesktop.impl.portal.FileChooser=aqua
org.freedesktop.impl.portal.Screenshot=aqua
org.freedesktop.impl.portal.Settings=aqua
org.freedesktop.impl.portal.Inhibit=aqua
# PipeWire screen casting is served by Aqua itself (falls back to xdg-desktop-portal-wlr);
# remote desktop: xdg-desktop-portal-wlr on top of Aqua's wlr-screencopy /
# ext-image-copy-capture implementation
org.freedesktop.impl.portal.ScreenCast=aqua;wlr
org.freedesktop.impl.portal.RemoteDesktop=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
