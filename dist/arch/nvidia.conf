# NVIDIA proprietary driver: kernel modesetting is required by every Wayland compositor.
# Install:  sudo cp /usr/share/aqua/nvidia-modprobe.conf /etc/modprobe.d/nvidia-aqua.conf
#           sudo mkinitcpio -P && reboot
options nvidia_drm modeset=1 fbdev=1
# keep VRAM contents across suspend (needs nvidia-suspend/resume/hibernate services)
options nvidia NVreg_PreserveVideoMemoryAllocations=1
