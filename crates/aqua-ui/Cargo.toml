[package]
name = "aqua-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aqua system apps written in Rust + Slint: System Settings, file chooser, authentication agent, greeter, dialogs"

[dependencies]
slint = { version = "1.13", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "renderer-femtovg", "unstable-winit-030"] }
aqua-config.workspace = true
aqua-log.workspace = true
tracing.workspace = true
aqua-apps.workspace = true
aqua-sys.workspace = true
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
libc = "0.2"
dirs.workspace = true
blocking = "1"
serde_json = "1"
image.workspace = true
aqua-icons.workspace = true
aqua-gfx.workspace = true
aqua-i18n.workspace = true
aqua-store.workspace = true
resvg = { version = "0.45", default-features = false }
# aqua_glass_v1 client (Liquid Glass shapes drawn by the compositor), on winit's connection
wayland-client = { version = "0.31", features = ["system"] }
wayland-scanner = "0.31"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.13"

[lints]
workspace = true
