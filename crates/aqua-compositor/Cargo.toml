[package]
name = "aqua-compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "aqua"
path = "src/main.rs"

[features]
default = ["screencast"]
# Native ScreenCast portal over PipeWire (needs libpipewire-0.3 and clang to build).
screencast = ["dep:aqua-screencast"]

[dependencies]
aqua-screencast = { workspace = true, optional = true }
smithay.workspace = true
smithay-drm-extras.workspace = true
# Only a cfg switch with the pure-Rust server backend: exposes per-client buffer limits.
wayland-server = { version = "0.31.14", default-features = false, features = ["libwayland_1_23"] }
tracing.workspace = true
bitflags = "2"
aqua-config.workspace = true
aqua-log.workspace = true
aqua-i18n.workspace = true
aqua-wm.workspace = true
aqua-gfx.workspace = true
aqua-icons.workspace = true
aqua-apps.workspace = true
aqua-wallpaper.workspace = true
aqua-shell.workspace = true
aqua-render.workspace = true
aqua-notify.workspace = true
image.workspace = true
libc = "0.2"
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
aqua-sys.workspace = true
aqua-tray.workspace = true
wayland-protocols = { version = "0.32", features = ["server", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["server"] }
wayland-scanner = "0.31"

[lints]
workspace = true
